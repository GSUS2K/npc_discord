services:
  npc:
    build: .
    container_name: npc-discord-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DASHBOARD_PORT: 3000
    ports:
      - '127.0.0.1:${DASHBOARD_PORT:-3000}:3000'
    volumes:
      - npc-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  npc-data:
